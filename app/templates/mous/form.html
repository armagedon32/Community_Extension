{% extends 'base.html' %}
{% block title %}MOU — CELMIS{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-4">{{ 'Edit MOU' if mou else 'Create New MOU' }}</h4>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">MOU Title *</label>
                <input type="text" name="title" class="form-control" required value="{{ mou.title if mou else '' }}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Partner</label>
                    <select name="partner_id" class="form-select">
                        <option value="">— None —</option>
                        {% for p in partners %}
                        <option value="{{ p.id }}" {% if mou and mou.partner_id == p.id %}selected{% endif %}>{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Related Project</label>
                    <select name="project_id" class="form-select">
                        <option value="">— None —</option>
                        {% for p in projects %}
                        <option value="{{ p.id }}" {% if mou and mou.project_id == p.id %}selected{% endif %}>{{ p.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ mou.description if mou else '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in MOU_STATUSES %}
                        <option value="{{ s }}" {% if mou and mou.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ mou.start_date.isoformat() if mou and mou.start_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ mou.end_date.isoformat() if mou and mou.end_date else '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">MOU File</label>
                <input type="file" name="file" class="form-control">
                {% if mou and mou.file_name %}
                <div class="small text-muted mt-1">Current: <i class="bi bi-paperclip"></i> {{ mou.file_name }}</div>
                {% endif %}
            </div>
            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ mou.notes if mou else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ 'Save Changes' if mou else 'Create MOU' }}</button>
                <a href="{{ url_for('mous.list_mous') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

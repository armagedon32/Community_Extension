{% extends 'base.html' %}
{% block title %}MOA — CELMIS{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-4">{{ 'Edit MOA' if moa else 'Create New MOA' }}</h4>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">MOA Title *</label>
                <input type="text" name="title" class="form-control" required value="{{ moa.title if moa else '' }}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Partner</label>
                    <select name="partner_id" class="form-select">
                        <option value="">— None —</option>
                        {% for p in partners %}
                        <option value="{{ p.id }}" {% if moa and moa.partner_id == p.id %}selected{% endif %}>{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Related Project</label>
                    <select name="project_id" class="form-select">
                        <option value="">— None —</option>
                        {% for p in projects %}
                        <option value="{{ p.id }}" {% if moa and moa.project_id == p.id %}selected{% endif %}>{{ p.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ moa.description if moa else '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in MOA_STATUSES %}
                        <option value="{{ s }}" {% if moa and moa.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ moa.start_date.isoformat() if moa and moa.start_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ moa.end_date.isoformat() if moa and moa.end_date else '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">MOA File</label>
                <input type="file" name="file" class="form-control">
                {% if moa and moa.file_name %}
                <div class="small text-muted mt-1">Current: <i class="bi bi-paperclip"></i> {{ moa.file_name }}</div>
                {% endif %}
            </div>
            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ moa.notes if moa else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ 'Save Changes' if moa else 'Create MOA' }}</button>
                <a href="{{ url_for('moas.list_moas') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

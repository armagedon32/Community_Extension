{% extends 'base.html' %}
{% block title %}Partner - CELMIS{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-4">{{ 'Edit Partner' if partner else 'Add New Partner' }}</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Partner Name *</label>
                <input type="text" name="name" class="form-control" required value="{{ partner.name if partner else '' }}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Partner Type</label>
                    <select name="partner_type" class="form-select">
                        {% for t in PARTNER_TYPES %}
                        <option value="{{ t }}" {% if partner and partner.partner_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" {% if partner and partner.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if partner and partner.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Engagement Level</label>
                    <select name="engagement_level" class="form-select">
                        <option value="">— Select —</option>
                        {% for lvl in ['Low', 'Medium', 'High'] %}
                        <option value="{{ lvl }}" {% if partner and partner.engagement_level == lvl %}selected{% endif %}>{{ lvl }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" value="{{ partner.address if partner else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Contact Person</label>
                    <input type="text" name="contact_person" class="form-control" value="{{ partner.contact_person if partner else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact_number" class="form-control" value="{{ partner.contact_number if partner else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ partner.email if partner else '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Contribution</label>
                <textarea name="contribution" class="form-control" rows="2">{{ partner.contribution if partner else '' }}</textarea>
            </div>
            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ partner.notes if partner else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ 'Save Changes' if partner else 'Add Partner' }}</button>
                <a href="{{ url_for('partners.list_partners') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

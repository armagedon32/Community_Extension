{% extends 'base.html' %}
{% block title %}New Transaction - CELMIS{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-4">Record New Transaction</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Description *</label>
                <input type="text" name="description" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Type</label>
                    <select name="transaction_type" class="form-select">
                        {% for t in TRANSACTION_TYPES %}
                        <option value="{{ t }}">{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Amount (PHP) *</label>
                    <input type="number" step="0.01" min="0" name="amount" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" name="transaction_date" class="form-control" value="{{ current_year }}-01-01">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Related Project</label>
                <select name="project_id" class="form-select">
                    <option value="">— None —</option>
                    {% for p in projects %}
                    <option value="{{ p.id }}">{{ p.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Remarks</label>
                <textarea name="remarks" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Transaction</button>
                <a href="{{ url_for('finance.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

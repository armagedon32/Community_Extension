{% extends 'base.html' %}
{% block title %}Beneficiary - CELMIS{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-4">{{ 'Edit Beneficiary' if beneficiary else 'Add Beneficiary' }}</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="full_name" class="form-control" required value="{{ beneficiary.full_name if beneficiary else '' }}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Beneficiary Segment</label>
                    <select name="segment" class="form-select">
                        <option value="">— Select —</option>
                        {% for s in BENEFICIARY_SEGMENTS %}
                        <option value="{{ s }}" {% if beneficiary and beneficiary.segment == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Beneficiary Group</label>
                    <select name="group_id" class="form-select">
                        <option value="">— Select —</option>
                        {% for g in groups %}
                        <option value="{{ g.id }}" {% if beneficiary and beneficiary.group_id == g.id %}selected{% endif %}>{{ g.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Sex</label>
                    <select name="sex" class="form-select">
                        <option value="">—</option>
                        <option value="Male" {% if beneficiary and beneficiary.sex == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if beneficiary and beneficiary.sex == 'Female' %}selected{% endif %}>Female</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" min="0" name="age" class="form-control" value="{{ beneficiary.age if beneficiary else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estimated Project</label>
                    <select name="project_id" class="form-select">
                        <option value="">— None —</option>
                        {% for p in projects %}
                        <option value="{{ p.id }}" {% if beneficiary and beneficiary.project_id == p.id %}selected{% endif %}>{{ p.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" value="{{ beneficiary.address if beneficiary else '' }}">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact" class="form-control" value="{{ beneficiary.contact if beneficiary else '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Occupation</label>
                    <input type="text" name="occupation" class="form-control" value="{{ beneficiary.occupation if beneficiary else '' }}">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ beneficiary.notes if beneficiary else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ 'Save Changes' if beneficiary else 'Add Beneficiary' }}</button>
                <a href="{{ url_for('beneficiaries.list_beneficiaries') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

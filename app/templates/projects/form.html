{% extends 'base.html' %}
{% block title %}{{ 'Edit' if is_edit else 'New' }} Project - CELMIS{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-4">{{ 'Edit Project' if is_edit else 'Create New Project' }}</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Project Title *</label>
                <input type="text" name="title" class="form-control" required value="{{ project.title if project else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Document to Auto-Fill Category</label>
                <div class="input-group">
                    <input type="file" name="document" id="docUpload" class="form-control" accept=".docx">
                    <button type="button" id="predictBtn" class="btn btn-outline-primary" disabled>Detect Category</button>
                </div>
                <div id="predictStatus" class="form-text text-muted mt-1"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select name="category" id="categorySelect" class="form-select">
                        {% for c in PROJECT_CATEGORIES %}
                        <option value="{{ c }}" {% if project and project.category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in PROJECT_STATUSES %}
                        <option value="{{ s }}" {% if project and project.status == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ project.description if project else '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Project Leader</label>
                    <select name="leader_id" class="form-select">
                        <option value="">— Select —</option>
                        {% for u in leaders %}
                        <option value="{{ u.id }}" {% if project and project.leader_id == u.id %}selected{% endif %}>{{ u.full_name }} ({{ u.role }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ project.location if project else '' }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" value="{{ project.start_date.isoformat() if project and project.start_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" value="{{ project.end_date.isoformat() if project and project.end_date else '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Budget (PHP)</label>
                    <input type="number" step="0.01" min="0" name="budget" class="form-control" value="{{ '%.2f'|format(project.budget or 0) if project else '' }}">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Progress (%)</label>
                <input type="range" class="form-range" min="0" max="100" step="5" name="progress"
                       value="{{ project.progress if project else 0 }}" id="progressRange">
                <div class="small text-muted">Current: <span id="progressLabel">{{ project.progress if project else 0 }}</span>%</div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ 'Save Changes' if is_edit else 'Create Project' }}</button>
                <a href="{{ url_for('projects.list_projects') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const range = document.getElementById('progressRange');
    const label = document.getElementById('progressLabel');
    range.addEventListener('input', () => label.textContent = range.value);

    const docUpload = document.getElementById('docUpload');
    const predictBtn = document.getElementById('predictBtn');
    const predictStatus = document.getElementById('predictStatus');
    const categorySelect = document.getElementById('categorySelect');

    docUpload.addEventListener('change', () => {
        predictBtn.disabled = !docUpload.files.length;
    });

    predictBtn.addEventListener('click', async () => {
        const file = docUpload.files[0];
        if (!file) return;

        predictBtn.disabled = true;
        predictStatus.textContent = 'Analyzing document...';
        predictStatus.className = 'form-text text-muted mt-1';

        const formData = new FormData();
        formData.append('document', file);

        try {
            const resp = await fetch("{{ url_for('projects.predict_category') }}", {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();

            if (data.error) {
                predictStatus.textContent = data.error;
                predictStatus.className = 'form-text text-danger mt-1';
            } else {
                categorySelect.value = data.category;
                predictStatus.textContent = 'Detected category: ' + data.category;
                predictStatus.className = 'form-text text-success mt-1';
            }
        } catch (err) {
            predictStatus.textContent = 'Error connecting to server.';
            predictStatus.className = 'form-text text-danger mt-1';
        } finally {
            predictBtn.disabled = false;
        }
    });
</script>
{% endblock %}

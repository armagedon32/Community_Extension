<div class="topbar">

    </div>

        <div class="text-end">
            <div class="fw-semibold small">{{ current_user.full_name }}</div>
            <span class="badge text-bg-primary small">{{ current_user.role }}</span>

            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" href="#"><i class="bi bi-person"></i> Profile</a></li>

        </div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block report_title %}CELMIS Report{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 2rem; color: #222; }
        .report-header { border-bottom: 3px solid #1a4d8f; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .report-header h1 { font-size: 1.4rem; font-weight: 700; color: #1a4d8f; }
        .report-header .office { font-size: .9rem; }
        .meta { font-size: .85rem; color: #555; }
        table { font-size: .9rem; }
        @media print { .no-print { display: none; } body { padding: 0; } }
    </style>
</head>
<body>
    <div class="report-header">
        <div class="text-center">
            <div class="office fw-bold">Kolehiyo ng Subic</div>
            <div class="office">Community Extension Services and Linkages Office</div>
            <h1 class="mt-2">{% block header_title %}Official Report{% endblock %}</h1>
        </div>
    </div>
    <div class="d-flex justify-content-between meta mb-3">
        <div>Generated: {{ generated_at }}</div>
        <div>Generated by: {{ current_user.full_name }} ({{ current_user.role }})</div>
    </div>
    <div class="no-print text-end mb-3">
        <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Print / Save PDF</button>
        <a href="{{ url_for('reports.index') }}" class="btn btn-outline-secondary btn-sm">Back to Reports</a>
    </div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% block report_content %}{% endblock %}
</body>
</html>
